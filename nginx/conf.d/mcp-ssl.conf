# ─── MCP server — HTTPS (mcp.medhistory.ru) ─────────────────────────────────
# Loaded only when /etc/letsencrypt/live/mcp.medhistory.ru/fullchain.pem exists
# (the nginx entrypoint in docker-compose.prod.yml removes this file otherwise,
# so nginx still starts when the cert hasn't been issued yet).
server {
    listen 443 ssl http2;
    server_name mcp.medhistory.ru;

    ssl_certificate     /etc/letsencrypt/live/mcp.medhistory.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mcp.medhistory.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL_MCP:10m;
    ssl_session_timeout 10m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    # Streamable HTTP responses can hold a long-lived SSE stream open.
    # Disable proxy buffering and bump read timeout.
    proxy_buffering off;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
    proxy_http_version 1.1;

    # Forward everything to backend with the /mcp prefix prepended.
    location / {
        proxy_pass http://backend/mcp$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}
