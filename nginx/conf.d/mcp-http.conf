# ─── MCP server — HTTP (mcp.medhistory.ru) ──────────────────────────────────
# Always loaded. Serves ACME challenges so certbot can issue/renew the cert
# even before the HTTPS block (mcp-ssl.conf) is enabled.
server {
    listen 80;
    server_name mcp.medhistory.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
