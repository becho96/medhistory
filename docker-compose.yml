# ==================================================
# MedHistory - Docker Compose Configuration
# ==================================================
# Локальная разработка
# Использование: ./deploy или docker compose up -d
# ==================================================

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-medhistory}
      POSTGRES_USER: ${POSTGRES_USER:-medhistory_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-medhistory_user} -d ${POSTGRES_DB:-medhistory}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - medhistory_network

  # MongoDB Database
  mongodb:
    image: mongo:7
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_INITDB_DATABASE:-medhistory}
    volumes:
      - mongodb_data:/data/db
    # ports: не нужен — backend и db-viewer подключаются по mongodb:27017 внутри сети
    # Если нужен доступ с хоста (Mongo Compass и т.п.), раскомментируйте:
    # ports:
    #   - "${MONGODB_PORT:-27017}:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - medhistory_network

  # MinIO Object Storage
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - medhistory_network

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    dns:
      - 8.8.8.8
      - 8.8.4.4
      - 1.1.1.1
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-medhistory_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-medhistory}
      MONGODB_URL: mongodb://${MONGO_INITDB_ROOT_USERNAME:-admin}:${MONGO_PASSWORD}@mongodb:27017/${MONGO_INITDB_DATABASE:-medhistory}?authSource=admin
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minio_admin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-google/gemini-2.5-flash}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      JWT_SECRET: ${JWT_SECRET}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://localhost:5173/auth/google/callback}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:3000}
      BOT_SECRET: ${BOT_SECRET:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      MCP_ENABLED: ${MCP_ENABLED:-false}
      MCP_BEARER_TOKEN: ${MCP_BEARER_TOKEN:-}
      MCP_USER_ID: ${MCP_USER_ID:-}
      MCP_OAUTH_ENABLED: ${MCP_OAUTH_ENABLED:-false}
      MCP_PUBLIC_URL: ${MCP_PUBLIC_URL:-http://localhost:8000}
      MCP_CONSENT_URL: ${MCP_CONSENT_URL:-http://localhost:5173/oauth/consent}
    volumes:
      - ./backend:/app
      - backend_uploads:/app/uploads
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - medhistory_network

  # Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    depends_on:
      - backend
    networks:
      - medhistory_network

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "${NGINX_PORT:-80}:80"
    depends_on:
      - frontend
      - backend
    networks:
      - medhistory_network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 3s
      retries: 3

  # DB Viewer — просмотр PostgreSQL и MongoDB, маппинг анализов
  db-viewer:
    build:
      context: ./db-viewer
      dockerfile: Dockerfile
    env_file:
      - .env.production
    environment:
      PG_HOST: postgres
      PG_PORT: "5432"
      PG_DB: ${POSTGRES_DB:-medhistory}
      PG_USER: ${POSTGRES_USER:-medhistory_user}
      PG_PASSWORD: ${POSTGRES_PASSWORD}
      MONGO_HOST: mongodb
      MONGO_PORT: "27017"
      MONGO_USER: ${MONGO_INITDB_ROOT_USERNAME:-admin}
      MONGO_PASSWORD: ${MONGO_PASSWORD}
      MONGO_DB: ${MONGO_INITDB_DATABASE:-medhistory}
      BACKEND_URL: http://backend:8000
      # Production SSH: ключ medhistory_deploy для Timeweb (override через PROD_SSH_KEY)
      PROD_SSH_KEY: ${PROD_SSH_KEY:-/root/.ssh/medhistory_deploy}
      # PROD_PG_PASSWORD, PROD_MONGO_PASSWORD — из .env.production
    volumes:
      # SSH ключи для Production (id_rsa или id_ed25519)
      - ${HOME}/.ssh:/root/.ssh:ro
    ports:
      - "5050:5050"
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      backend:
        condition: service_started
    networks:
      - medhistory_network

  # Telegram Bot — long-polling aiogram service (no inbound ports)
  bot:
    build:
      context: ./bot
      dockerfile: Dockerfile
    dns:
      - 8.8.8.8
      - 1.1.1.1
    environment:
      BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      BOT_SECRET: ${BOT_SECRET}
      BACKEND_INTERNAL_URL: http://backend:8000
      MINIAPP_URL: ${MINIAPP_URL:-https://medhistory.ru}
      LEGAL_BASE_URL: ${LEGAL_BASE_URL:-https://medhistory.ru}
    volumes:
      - ./bot:/app
    depends_on:
      backend:
        condition: service_started
    networks:
      - medhistory_network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  mongodb_data:
    driver: local
  minio_data:
    driver: local
  backend_uploads:
    driver: local

networks:
  medhistory_network:
    name: medhistory_network
    driver: bridge

