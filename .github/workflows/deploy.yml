name: Deploy to Production

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch, tag or commit SHA to deploy'
        required: true
        default: 'main'
        type: string
      service:
        description: 'Service to deploy'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - backend
          - frontend
          - bot
          - monitoring

env:
  SERVER_IP: ${{ secrets.SERVER_IP }}
  SERVER_USER: ${{ secrets.SERVER_USER }}
  DEPLOY_PATH: ~/medhistory

jobs:
  deploy:
    name: Deploy ${{ inputs.service }} from ${{ inputs.ref }}
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add server to known hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.SERVER_IP }} >> ~/.ssh/known_hosts
          cat >> ~/.ssh/config <<EOF
          Host ${{ secrets.SERVER_IP }}
            ServerAliveInterval 30
            ServerAliveCountMax 20
          EOF

      - name: Login to Docker Hub on server
        continue-on-error: true
        run: |
          ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }} \
            "echo '${{ secrets.DOCKER_PASSWORD }}' | docker login -u '${{ secrets.DOCKER_USERNAME }}' --password-stdin"

      - name: Deploy to server
        run: |
          echo "🚀 Deploying ${{ inputs.service }} from ref: ${{ inputs.ref }}"
          
          # Sync files to server (excluding sensitive and generated files)
          rsync -avz --delete \
            --exclude '.git' \
            --exclude '.github' \
            --exclude 'node_modules' \
            --exclude '__pycache__' \
            --exclude '.env' \
            --exclude '.env.production' \
            --exclude 'venv' \
            --exclude '*.pyc' \
            --exclude '.DS_Store' \
            --exclude 'frontend/.env' \
            --exclude 'nginx-temp' \
            ./ ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }}:${{ env.DEPLOY_PATH }}/
          
          # Build and restart containers using production compose file
          # --env-file .env.production — переменные (OPENROUTER_MODEL и др.) из .env.production на сервере
          SSH="ssh -o ServerAliveInterval=30 -o ServerAliveCountMax=20 ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }}"
          BUILD="docker compose -f docker-compose.prod.yml --env-file .env.production build --no-cache --progress=plain"
          UP="docker compose -f docker-compose.prod.yml --env-file .env.production up -d"
          MON_BUILD="docker compose -f monitoring/docker-compose.monitoring.yml --env-file .env.production build --no-cache --progress=plain"
          MON_UP="docker compose -f monitoring/docker-compose.monitoring.yml --env-file .env.production up -d"

          if [ "${{ inputs.service }}" = "all" ]; then
            $SSH "cd ${{ env.DEPLOY_PATH }} && $BUILD && $UP && $MON_BUILD && $MON_UP"
          elif [ "${{ inputs.service }}" = "backend" ]; then
            $SSH "cd ${{ env.DEPLOY_PATH }} && $BUILD backend && $UP backend"
          elif [ "${{ inputs.service }}" = "frontend" ]; then
            $SSH "cd ${{ env.DEPLOY_PATH }} && $BUILD frontend && $UP frontend"
          elif [ "${{ inputs.service }}" = "bot" ]; then
            $SSH "cd ${{ env.DEPLOY_PATH }} && $BUILD bot && $UP bot"
          elif [ "${{ inputs.service }}" = "monitoring" ]; then
            $SSH "cd ${{ env.DEPLOY_PATH }} && $MON_BUILD && $MON_UP"
          fi

      - name: Health check
        run: |
          echo "⏳ Waiting for services to start..."
          sleep 10
          
          echo "🔍 Checking frontend health..."
          curl -sf --max-time 10 http://${{ secrets.SERVER_IP }}/ > /dev/null && echo "✅ Frontend is healthy" || echo "⚠️ Frontend check failed"
          
          echo "🔍 Checking API through nginx proxy..."
          curl -sf --max-time 10 http://${{ secrets.SERVER_IP }}/docs > /dev/null && echo "✅ API is healthy" || echo "⚠️ API check failed"
          
          echo "🔍 Checking health endpoint..."
          curl -sf --max-time 10 http://${{ secrets.SERVER_IP }}/health > /dev/null && echo "✅ Health check passed" || echo "⚠️ Health check failed"

          if [ "${{ inputs.service }}" = "all" ] || [ "${{ inputs.service }}" = "monitoring" ]; then
            echo "🔍 Checking Grafana..."
            curl -sf --max-time 15 http://${{ secrets.SERVER_IP }}/grafana/api/health > /dev/null && echo "✅ Grafana is healthy" || echo "⚠️ Grafana check failed (may need a minute to start)"
          fi

      - name: Deployment summary
        run: |
          echo "## 🎉 Deployment Complete!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Parameter | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| **Ref** | \`${{ inputs.ref }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Service** | ${{ inputs.service }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Server** | ${{ secrets.SERVER_IP }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🔗 Links" >> $GITHUB_STEP_SUMMARY
          echo "- [Frontend](http://${{ secrets.SERVER_IP }}/)" >> $GITHUB_STEP_SUMMARY
          echo "- [API Documentation](http://${{ secrets.SERVER_IP }}/docs)" >> $GITHUB_STEP_SUMMARY
          echo "- [API Endpoint](http://${{ secrets.SERVER_IP }}/api/v1/)" >> $GITHUB_STEP_SUMMARY
          echo "- [Grafana](http://${{ secrets.SERVER_IP }}/grafana/)" >> $GITHUB_STEP_SUMMARY

