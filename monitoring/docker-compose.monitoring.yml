# Monitoring stack for MedHistory
# Requires the main stack (docker-compose.prod.yml) to be running first (network must exist).
#
# Deploy:
#   docker compose -f monitoring/docker-compose.monitoring.yml --env-file .env.production up -d --build
#
# Required env vars (add to .env.production):
#   GF_SECURITY_ADMIN_PASSWORD — Grafana admin password
#   GF_SERVER_ROOT_URL         — e.g. http://194.87.140.190/grafana/
#   GF_SERVER_DOMAIN           — e.g. 194.87.140.190
#   POSTGRES_USER, POSTGRES_PASSWORD, POSTGRES_DB
#   MONGO_INITDB_ROOT_USERNAME, MONGO_PASSWORD

services:
  prometheus:
    image: prom/prometheus:v2.51.2
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
      - '--web.enable-lifecycle'
    expose:
      - "9090"
    networks:
      - medhistory_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 3

  grafana:
    image: grafana/grafana:10.4.2
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:-changeme}
      GF_SERVER_ROOT_URL: ${GF_SERVER_ROOT_URL:-http://localhost/grafana/}
      GF_SERVER_DOMAIN: ${GF_SERVER_DOMAIN:-localhost}
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    expose:
      - "3000"
    depends_on:
      - prometheus
    networks:
      - medhistory_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  node_exporter:
    image: prom/node-exporter:v1.8.0
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
      - '--web.listen-address=:9101'
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    expose:
      - "9101"
    networks:
      - medhistory_network
    restart: unless-stopped

  postgres_exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    environment:
      DATA_SOURCE_NAME: postgresql://${POSTGRES_USER:-medhistory_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-medhistory}?sslmode=disable
    expose:
      - "9187"
    networks:
      - medhistory_network
    restart: unless-stopped

  mongodb_exporter:
    image: percona/mongodb_exporter:0.40
    environment:
      MONGODB_URI: mongodb://${MONGO_INITDB_ROOT_USERNAME:-admin}:${MONGO_PASSWORD}@mongodb:27017/?authSource=admin
    command:
      - '--collect-all'
    expose:
      - "9216"
    networks:
      - medhistory_network
    restart: unless-stopped

  custom_exporter:
    build:
      context: ./exporters
      dockerfile: Dockerfile
    environment:
      BACKEND_URL: http://backend:8000
      SCRAPE_INTERVAL: "30"
      EXPORTER_PORT: "9100"
    expose:
      - "9100"
    networks:
      - medhistory_network
    restart: unless-stopped

volumes:
  prometheus_data:
    driver: local
  grafana_data:
    driver: local

networks:
  medhistory_network:
    external: true
