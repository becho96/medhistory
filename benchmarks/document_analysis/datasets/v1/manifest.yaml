# Манифест датасета v1. Файл иммутабелен после фиксации версии:
# любое существенное изменение состава документов или ground_truth → новая v2.
#
# Документы лежат рядом в `documents/` (gitignored). Записи ниже описывают
# каждый документ: id, файл, sha256, формат, теги. Ground truth для
# документа лежит в `ground_truth/<id>.json`.

version: 1
created_at: "2026-05-13"
status: in_progress  # in_progress | frozen
description: |
  Стартовая выборка (10-15 документов) для прогона полного pipeline.
  Цель — покрыть основные форматы, которые встречаются в реальности
  у российских пользователей, и зафиксировать baseline для последующих
  итераций.

changes_from_previous: "initial"

# Категории покрытия. target_count — желаемое число документов категории.
# Поле справочное; фактическое распределение видно по `documents` ниже.
categories:
  pdf_text:
    target_count: 4
    description: "Текстовый PDF (распечатанные лаб. результаты с текст. слоем)."
  pdf_scan:
    target_count: 2
    description: "Отсканированный PDF без текст. слоя. Pipeline сейчас падает — ожидаем deterministic failure."
  image_lab_printed:
    target_count: 3
    description: "Фото/скан печатных лаб. результатов (JPG/PNG)."
  photo_handwritten:
    target_count: 3
    description: "Фото рукописных документов (направления, выписки)."
  docx:
    target_count: 2
    description: "DOCX (выписки, заключения)."

# Список документов. Заполняется по мере добавления файлов в `documents/`.
