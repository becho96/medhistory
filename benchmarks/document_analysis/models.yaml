# Реестр моделей для бенчмарка первичного анализа документов.
#
# Все модели вызываются через OpenRouter (тот же клиент, что в prod-AIService).
# Чтобы добавить новую модель — добавьте запись в `extraction_models` и
# запустите `python -m benchmarks.document_analysis.src.cli run --model <id>`.
#
# Поля:
#   id              — короткий человекочитаемый идентификатор (используется
#                     в именах папок runs/ и в командах CLI)
#   openrouter_slug — точный slug модели в OpenRouter (`provider/model[:variant]`)
#   temperature     — температура для extraction-вызова
#   notes           — свободная заметка для оператора
#
# `judge` секция описывает фиксированную модель-судью для оценки summary.
# Менять её НЕ нужно вместе с extraction-моделями — это исказит сравнение
# между runs. Замену делать сознательно, с пометкой в датасет-манифесте.

extraction_models:
  - id: gemini-2.5-flash
    openrouter_slug: google/gemini-2.5-flash
    temperature: 0.1
    notes: "Текущая prod-модель (на 2026-05-13)."

  - id: gemini-2.5-pro
    openrouter_slug: google/gemini-2.5-pro
    temperature: 0.1
    notes: "Старший Gemini — для сравнения качества."

  - id: claude-opus-4.7
    openrouter_slug: anthropic/claude-opus-4.7
    temperature: 0.1
    notes: "Топ-модель Anthropic. Точный slug проверить при первом запуске."

  - id: claude-sonnet-4.6
    openrouter_slug: anthropic/claude-sonnet-4.6
    temperature: 0.1
    notes: "Средний Anthropic. Проверить slug при первом запуске."

judge:
  id: claude-opus-4.7-judge
  openrouter_slug: anthropic/claude-opus-4.7
  temperature: 0.0
  notes: "Фиксированный судья для summary. Менять только сознательно."
