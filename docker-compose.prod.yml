# ==================================================
# MedHistory - Production Docker Compose Configuration
# ==================================================
# Production deployment с nginx reverse proxy
# Использование: docker compose -f docker-compose.prod.yml up -d
# ==================================================

services:
  # PostgreSQL Database (pgvector-enabled image, drop-in for postgres:16)
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-medhistory}
      POSTGRES_USER: ${POSTGRES_USER:-medhistory_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-medhistory_user} -d ${POSTGRES_DB:-medhistory}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - medhistory_network
    restart: unless-stopped

  # MongoDB Database
  mongodb:
    image: mongo:7
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_INITDB_DATABASE:-medhistory}
    volumes:
      - mongodb_data:/data/db
    ports:
      - "${MONGODB_PORT:-27017}:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - medhistory_network
    restart: unless-stopped

  # MinIO Object Storage
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - medhistory_network
    restart: unless-stopped

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    dns:
      - 8.8.8.8
      - 8.8.4.4
      - 1.1.1.1
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-medhistory_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-medhistory}
      MONGODB_URL: mongodb://${MONGO_INITDB_ROOT_USERNAME:-admin}:${MONGO_PASSWORD}@mongodb:27017/${MONGO_INITDB_DATABASE:-medhistory}?authSource=admin
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minio_admin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-google/gemini-2.5-flash}
      # Route outbound LLM HTTPS (OpenRouter/Anthropic) through an offshore
      # proxy — the prod RU IP is geoblocked by OpenRouter (403). Internal
      # http services (embeddings/minio) and DBs are excluded via NO_PROXY.
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      https_proxy: ${HTTPS_PROXY:-}
      NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1,postgres,mongodb,minio,embeddings}
      no_proxy: ${NO_PROXY:-localhost,127.0.0.1,postgres,mongodb,minio,embeddings}
      JWT_SECRET: ${JWT_SECRET}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://localhost:5173/auth/google/callback}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost,http://localhost:80}
      EMBEDDINGS_URL: http://embeddings:8001
      BOT_SECRET: ${BOT_SECRET:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      MCP_ENABLED: ${MCP_ENABLED:-false}
      MCP_BEARER_TOKEN: ${MCP_BEARER_TOKEN:-}
      MCP_USER_ID: ${MCP_USER_ID:-}
      MCP_OAUTH_ENABLED: ${MCP_OAUTH_ENABLED:-false}
      MCP_PUBLIC_URL: ${MCP_PUBLIC_URL:-https://mcp.medhistory.ru}
      MCP_CONSENT_URL: ${MCP_CONSENT_URL:-https://medhistory.ru/oauth/consent}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-https://medhistory.ru}
    volumes:
      - backend_uploads:/app/uploads
    expose:
      - "8000"
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - medhistory_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Embeddings sidecar — multilingual-e5-base behind a tiny FastAPI
  embeddings:
    build:
      context: ./embeddings
      dockerfile: Dockerfile
    environment:
      EMBEDDINGS_MODEL: ${EMBEDDINGS_MODEL:-intfloat/multilingual-e5-base}
    volumes:
      - embeddings_models:/models
    expose:
      - "8001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8001/health', timeout=2).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      - medhistory_network
    restart: unless-stopped

  # Frontend (Production build with nginx)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        VITE_API_URL: ""
        VITE_MCP_PUBLIC_URL: ${MCP_PUBLIC_URL:-https://mcp.medhistory.ru}
        VITE_YM_ID: "109257743"
    expose:
      - "80"
    depends_on:
      - backend
    networks:
      - medhistory_network
    restart: unless-stopped

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - certbot_certs:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot
      # B2B presentation static content — served at medhistory.ru/b2b
      - ./presentation:/usr/share/nginx/b2b:ro
    ports:
      - "${NGINX_PORT:-80}:80"
      - "443:443"
    depends_on:
      - frontend
      - backend
    networks:
      - medhistory_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 3s
      retries: 3

  # Certbot — получение и автообновление SSL-сертификатов Let's Encrypt
  certbot:
    image: certbot/certbot
    volumes:
      - certbot_certs:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --quiet; sleep 12h & wait $${!}; done'"
    depends_on:
      - nginx
    networks:
      - medhistory_network
    restart: unless-stopped

  # Telegram Bot — long-polling aiogram service (no inbound ports)
  bot:
    build:
      context: ./bot
      dockerfile: Dockerfile
    dns:
      - 8.8.8.8
      - 8.8.4.4
      - 1.1.1.1
    environment:
      BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      BOT_SECRET: ${BOT_SECRET}
      BACKEND_INTERNAL_URL: http://backend:8000
      MINIAPP_URL: ${MINIAPP_URL:-https://medhistory.ru}
      LEGAL_BASE_URL: ${LEGAL_BASE_URL:-https://medhistory.ru}
    depends_on:
      backend:
        condition: service_started
    networks:
      - medhistory_network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  mongodb_data:
    driver: local
  minio_data:
    driver: local
  backend_uploads:
    driver: local
  certbot_certs:
    driver: local
  certbot_www:
    driver: local
  embeddings_models:
    driver: local

networks:
  medhistory_network:
    name: medhistory_network
    driver: bridge

